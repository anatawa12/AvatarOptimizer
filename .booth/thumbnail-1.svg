<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <!-- Background -->
    <rect width="1024" height="1024" fill="rgb(45,45,45)"/>
    <!-- Two Black lines -->
    <g transform="translate(512, 512)">
        <!-- 1024 / 16 * 9 / 2 + 2 = 290 -->
        <!-- 1024 / 16 * 9     + 4 = 580 -->
        <rect x="-514" y="-290" width="1028" height="580" fill="none" stroke="black" stroke-width="4"/>
    </g>
    <!-- Main text -->
    <g>
        <text text-anchor="middle" x="0" y="410" class="genzyu-medium">
            <tspan style="font-size:125px; fill:white;" x="512" dy="0">Avatar Optimizer</tspan>
            <tspan style="font-size:117px;" x="512" dy="200">簡単軽量化</tspan>
            <tspan style="font-size:117px;" x="512" dy="117">アバターツール</tspan>
        </text>
    </g>
    <!-- Bottom -->
    <g>
        <text x="512px" y="873.669px" text-anchor="middle" class="hiragino" style="font-size:45.833px;">
            Poor/Very Poor <tspan style="font-size:37.5px;">から </tspan>Good/Medium <tspan style="font-size:37.5px;">へ</tspan>
        </text>

        <image x="120" y="892" width="128px" height="128px" href="./external-assets/poor.png"/>
        <image x="261" y="892" width="128px" height="128px" href="./external-assets/very-poor.png"/>
        <image x="635" y="892" width="128px" height="128px" href="./external-assets/good.png"/>
        <image x="776" y="892" width="128px" height="128px" href="./external-assets/medium.png"/>
        <path style="fill:rgb(0,144,205);" d="
            M402, 941
            L579, 941
            L579, 913
            L622, 956
            L579, 999
            L579, 971
            L402, 971
            Z
        "/>
    </g>
    <!-- Top -->
    <g>
        <image x="256" y="26" width="281px" height="78px" href="./external-assets/modular-avatar.png"/>
        <text class="anchor-start genzyu-bold" x="545" y="96" style="font-size:57px;fill:white;">併用可能</text>
        <text x="512" y="172" class="genzyu-medium" style="font-size:57px;">無料ツール</text>
    </g>
    <style>
        text {
            font-kerning: normal;
            fill: rgb(211,211,211);
            text-anchor: middle;
        }
        .genzyu-medium {
            font-family: 'GenJyuuGothic-Medium', 'Gen Jyuu Gothic', sans-serif;
            font-weight: 500;
        }
        .genzyu-bold {
            font-family: 'GenJyuuGothic-Bold', 'Gen Jyuu Gothic', sans-serif;
            font-weight: 700;
        }
        .hiragino {
            font-family: 'HiraginoSans-W4', 'Hiragino Sans', sans-serif;
            font-weight: 400;
        }
        .anchor-start {
            text-anchor: start;
        }
    </style>
</svg>
