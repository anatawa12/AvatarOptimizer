name: GameCI
# note: name is referenced by other workflow

on:
  push:
    branches: [ master, master-*, workflow-tests/*, unity-6000-support ]
  pull_request_target: {}
  workflow_dispatch: {}

permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # unity 2022.3.6 test
          - { name: 2022.3.6f1-latest,        unity: 2022.3.6f1,  vrcsdk: latest, ndmf: latest, }
          # latest SDK with primary unity version
          - { name: 2022.3.22f1-latest,       unity: 2022.3.22f1, vrcsdk: latest, ndmf: latest, }
          # all supported major versions
          - { name: 2022.3.22f1-3.7.0,        unity: 2022.3.22f1, vrcsdk: 3.7.0,  ndmf: latest, }
          - { name: 2022.3.22f1-3.8.0,        unity: 2022.3.22f1, vrcsdk: 3.8.0,  ndmf: latest, }
          - { name: 2022.3.22f1-3.9.0,        unity: 2022.3.22f1, vrcsdk: 3.9.0,  ndmf: latest, }
          - { name: 2022.3.22f1-3.10.0,       unity: 2022.3.22f1, vrcsdk: 3.10.0, ndmf: latest, }
          # new components versions
          # - 3.8.0 # AAO_VRCSDK3_AVATARS_IGNORE_OTHER_PHYSBONE
          - { name: 2022.3.22f1-3.10.3,       unity: 2022.3.22f1, vrcsdk: 3.10.3, ndmf: latest, } # AAO_VRCSDK3_AVATARS_VRC_RAYCAST
          - { name: 2022.3.22f1-3.10.4,       unity: 2022.3.22f1, vrcsdk: 3.10.4, ndmf: latest, } # AAO_VRCSDK3_AVATARS_PHYSBONE_GLOBAL_COLLIDER
          # No VRChat SDK Environments
          - { name: 2022.3.22f1-no-sdk,       unity: 2022.3.22f1,                 ndmf: latest, }
          # oldest possible NDMF version
          - { name: 2022.3.22f1-old-ndmf,     unity: 2022.3.22f1, vrcsdk: 3.10.4, ndmf: 1.8.1, }  # needs https://github.com/bdunderscore/ndmf/commit/ac0198ec327be029e44ecda4326d32ddfc45b094

          # Experimental Unity 6000 support
          # We test each unity 6000.x since most release introduces changes that are necessary to handle in our side 
          # VRCSDK doesn't support unity 6000 so we test without VRCSDK
          - { name: 6000.0.59f2,              unity: 6000.0.59f2,                 ndmf: latest, } # minimum 6000.0 versions w/o security issue
          - { name: 6000.1.17f1,              unity: 6000.1.17f1,                 ndmf: latest, } # minimum 6000.1 versions w/o security issue
          - { name: 6000.2.12f1,              unity: 6000.2.12f1,                 ndmf: latest, } # minimum 6000.2 versions with symlink issue fixed UUM-119544: https://issuetracker.unity.com/issues/21352/
          - { name: 6000.3.0f1,               unity: 6000.3.0f1,                  ndmf: latest, }
          - { name: 6000.4.0f1,               unity: 6000.4.0f1,                  ndmf: latest, }
          #- { name: 6000.5.0f1,               unity: 6000.5.0f1,                  ndmf: latest, } # NDMF is not compilable for Unity 6000.5, see https://github.com/bdunderscore/ndmf/pull/808
          #- { name: 6000.6.0b8,               unity: 6000.6.0b8,                  ndmf: latest, } # 6 is still in beta and no gameci image

    env:
      VRCSDK_VERSION: ${{ matrix.vrcsdk }}
      NDMF_VERSION: ${{ matrix.ndmf }}

    steps:
      # install tools
      - uses: anatawa12/sh-actions/setup-vrc-get@master
      - name: Set up repository
        run: vrc-get repo add https://vpm.nadena.dev/vpm-prerelease.json

      # prepare project
      - name: Create Project directory
        shell: bash
        env: 
          UNITY_VERSION: ${{ matrix.unity }}
        run: |-
          mkdir -p Assets Packages ProjectSettings
          echo "m_EditorVersion: $UNITY_VERSION" > ProjectSettings/ProjectVersion.txt
          # create manifest.json with necessary dependencies
          # com.vrchat.base has missing dependency to com.unity.ugui (only 3.7.x), com.unity.modules.video and com.unity.modules.physics2d
          # com.unity.xr.oculus, a package referenced by com.vrchat.base, has missing dependency to com.unity.modules.androidjni
          # NDMF had missing dependency to com.unity.modules.animation until https://github.com/bdunderscore/ndmf/pull/655 was merged in 1.8.0
          # We need com.unity.test-framework and com.unity.testtools.codecoverage for tests
          cat <<EOF > Packages/manifest.json
          {
            "dependencies": {
              "com.unity.modules.androidjni": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.video": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.test-framework": "1.1.33",
              "com.unity.testtools.codecoverage": "1.2.7"
            }
          }
          EOF
          # enable enter play mode settings
          cat <<EOF > ProjectSettings/EditorSettings.asset
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!159 &1
          EditorSettings:
            serializedVersion: 9
            m_EnterPlayModeOptionsEnabled: 1
            m_EnterPlayModeOptions: 3
          EOF
          # configure player settings
          cat <<EOF > ProjectSettings/ProjectSettings.asset
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            serializedVersion: 26
            scriptingDefineSymbols:
              Android: ${VRCSDK_VERSION:+VRC_SDK_VRCSDK3;UNITY_POST_PROCESSING_STACK_V2}
              Standalone: ${VRCSDK_VERSION:+VRC_SDK_VRCSDK3;UNITY_POST_PROCESSING_STACK_V2}
              iPhone: ${VRCSDK_VERSION:+VRC_SDK_VRCSDK3;UNITY_POST_PROCESSING_STACK_V2}
            apiCompatibilityLevel: 3
            activeInputHandler: 0
          EOF
          # link tests
          ln -s "../Packages/com.anatawa12.avatar-optimizer/Test~" Assets/Test

      # prepare packages
      - uses: actions/checkout@v4
        with:
          path: Packages/com.anatawa12.avatar-optimizer
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Install VRChat SDK Avatars ${{ matrix.vrcsdk }}
        if: ${{ matrix.vrcsdk }}
        run: vrc-get install -y com.vrchat.avatars ${VRCSDK_VERSION/latest/}
      - name: Set up dummy SDK Avatars if no-SDK mode ${{ matrix.vrcsdk }}
        if: ${{ !matrix.vrcsdk }}
        run: |
          mkdir -p Packages/com.vrchat.avatars && echo '{"name":"com.vrchat.avatars","version":"0.0.0"}' > Packages/com.vrchat.avatars/package.json
          mkdir -p Packages/com.vrchat.base && echo '{"name":"com.vrchat.base","version":"0.0.0"}' > Packages/com.vrchat.base/package.json
      - name: Install NDMF ${{ matrix.ndmf }}
        run: vrc-get install -y nadena.dev.ndmf ${NDMF_VERSION/latest/}
      - uses: anatawa12/sh-actions/resolve-vpm-packages@master
      - name: Set up for no VRChat SDK Environment
        if: ${{ !matrix.vrcsdk }}
        run: |-
          rm -rf Packages/{com.vrchat.avatars,com.vrchat.base}
          # ndmf requires several external libraries and manual activation
          ln -s Dependencies\~ Packages/nadena.dev.ndmf/Dependencies
      - name: Apply patch for NDMF
        run: |-
          # apply https://github.com/bdunderscore/ndmf/pull/826 but for all ndmf versions
          sed -i.bak 's/using (_report\./using (ErrorReport.CurrentReport./' Packages/nadena.dev.ndmf/Editor/API/BuildContext.cs
          rm Packages/nadena.dev.ndmf/Editor/API/BuildContext.cs.bak
      - name: Disable crunch compression
        run: |
          grep --null -rlF 'crunchedCompression: 1' . | xargs -0 -I{} sh -c 'echo "$1"; sed -i.bak "s/crunchedCompression: 1/crunchedCompression: 0/" "$1" && rm "$1.bak"' - {}

      - uses: actions/cache@v4
        if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          path: Library
          key: Library-${{ matrix.name }}
          restore-keys: Library-${{ matrix.name }}

      - uses: anatawa12/unity-test-runner@v0.1
        id: gameci
        with:
          testMode: EditMode
          licenseXml: ${{ secrets.UNITY_LICENSE_XML }}
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+com.anatawa12.avatar-optimizer.*,-*.test.*
          customParameters: 

      - name: "Show files at root folder to find crash log"
        if: always()
        run: ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results ${{ matrix.name }}
          path: artifacts

  conclude-gameci:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build-and-test]
    steps:
      - name: Conclude Tests
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: |
          echo "$NEEDS" | jq -c '. | to_entries[] | [.key, .value.result]'
          echo "$NEEDS" | jq -e '. | all(.result == "success")' > /dev/null
